name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install and type-check isolated production E2E
        run: npm --prefix tests/e2e ci && npm --prefix tests/e2e run typecheck

      - name: Lint
        run: npm run lint:ratchet

      - name: Type Check
        run: npm run typecheck:ratchet

      - name: Unit and contract tests
        run: npm run test:web --if-present

      - name: Install Chromium for browser gate
        run: npx playwright install --with-deps chromium

      - name: Recruitment browser and fault-path gate
        run: npm run test:functional

      - name: Production build
        run: npm run build
        env:
          # Match the release builder's minimum build-time contract without
          # exposing production credentials. Some server-only routes create a
          # Supabase client while Next.js collects page data.
          SUPABASE_URL: https://ci.invalid
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
